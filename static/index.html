<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RC Control</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    /* ── Reset & base ─────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0D0D0D;
      --surface:   #1A1A1A;
      --border:    #2A2A2A;
      --text:      #F0F0F0;
      --muted:     #666;
      --danger:    #FF4444;
      --radius:    6px;

      /* Player identity colours, as r,g,b so they can be used with alpha. */
      --p0-rgb: 232, 255, 0;     /* yellow - the original accent */
      --p1-rgb: 0, 212, 255;     /* cyan */
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 14px;
      -webkit-tap-highlight-color: transparent;
      overflow: hidden;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    /* ── Header ───────────────────────────────────────────────────────── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 20px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .wordmark {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 18px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .wordmark span { color: rgb(var(--p0-rgb)); }

    .status {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--muted);
      flex-shrink: 0;
      transition: background 0.3s;
    }
    .dot.on  { background: rgb(var(--p-rgb, var(--p0-rgb))); }
    .dot.off { background: var(--danger); }

    /* ── Split layout ─────────────────────────────────────────────────── */
    #split {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 1fr 1px 1fr;
    }

    .divider { background: var(--border); }

    .panel {
      --p-rgb: var(--p0-rgb);
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    .panel[data-player="1"] { --p-rgb: var(--p1-rgb); }

    /* Panel head: the coloured bar is the player's identity. */
    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 16px;
      border-top: 3px solid rgb(var(--p-rgb));
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .player-name {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 20px;
      letter-spacing: 0.06em;
      color: rgb(var(--p-rgb));
    }

    .ctrl {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
    }
    .ctrl.connected { color: var(--text); }

    /* ── Vertical carousel ────────────────────────────────────────────── */
    .carousel {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      scroll-snap-type: y mandatory;
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: var(--pad, 0px) 16px;
      scrollbar-width: none;
      /* Fade the neighbours that peek in above and below the centre card. */
      -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 12%, #000 88%, transparent 100%);
              mask-image: linear-gradient(to bottom, transparent 0, #000 12%, #000 88%, transparent 100%);
    }
    .carousel::-webkit-scrollbar { display: none; }

    /* ── Vehicle card ─────────────────────────────────────────────────── */
    .vehicle-card {
      flex: 0 0 var(--card-h, 220px);
      display: flex;
      flex-direction: column;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      cursor: pointer;
      user-select: none;
      position: relative;
      scroll-snap-align: center;
      outline: 2px solid transparent;
      outline-offset: 2px;
      transition: border-color 0.15s, transform 0.1s, opacity 0.2s;
    }

    .vehicle-card:active:not(.taken) { transform: scale(0.98); }
    .vehicle-card:focus-visible { outline-color: var(--text); }

    .vehicle-card.selected {
      border-color: rgb(var(--p-rgb));
      outline-color: rgb(var(--p-rgb));
    }
    .vehicle-card.pulse { animation: corona-pulse 0.35s ease-out forwards; }

    @keyframes corona-pulse {
      0%   { box-shadow: 0 0 0 0 rgba(var(--p-rgb), 0.55); }
      60%  { box-shadow: 0 0 0 8px rgba(var(--p-rgb), 0.15); }
      100% { box-shadow: 0 0 0 4px rgba(var(--p-rgb), 0.08); }
    }
    @media (prefers-reduced-motion: reduce) {
      .vehicle-card.pulse { animation: none; box-shadow: 0 0 0 4px rgba(var(--p-rgb), 0.12); }
    }

    /* A vehicle held by the other player: visible but not selectable. */
    .vehicle-card.taken { cursor: not-allowed; }
    .vehicle-card.taken .card-image,
    .vehicle-card.taken .card-body { opacity: 0.35; filter: grayscale(1); }

    .card-image {
      flex: 1;
      min-height: 0;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: opacity 0.2s;
    }
    .card-image img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .img-placeholder { font-size: 40px; opacity: 0.18; }

    .card-badge {
      display: none;
      position: absolute;
      top: 8px;
      right: 8px;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 500;
      color: #000;
      background: rgb(var(--badge-rgb, var(--p-rgb)));
    }
    .vehicle-card.selected .card-badge,
    .vehicle-card.taken .card-badge { display: flex; }

    .card-badge svg {
      width: 12px; height: 12px;
      stroke: #000; stroke-width: 2.5; fill: none;
    }
    .vehicle-card.taken .card-badge svg { display: none; }

    .card-body { padding: 10px 14px 12px; flex-shrink: 0; transition: opacity 0.2s; }

    .card-name {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 19px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-mac {
      font-size: 10px;
      color: var(--muted);
      margin-top: 3px;
      letter-spacing: 0.03em;
    }

    .state-message {
      margin: auto;
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
      font-size: 13px;
    }

    /* ── Panel footer ─────────────────────────────────────────────────── */
    .panel-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 16px;
      border-top: 1px solid var(--border);
      min-height: 52px;
      flex-shrink: 0;
    }

    .sel-label { font-size: 12px; color: var(--muted); }
    .sel-label strong {
      color: rgb(var(--p-rgb));
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .release {
      display: none;
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 8px 16px;
      border-radius: var(--radius);
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }
    .release:active { border-color: var(--danger); color: var(--danger); }

    /* ── Toast ────────────────────────────────────────────────────────── */
    #toast {
      position: fixed;
      left: 50%;
      bottom: 70px;
      transform: translate(-50%, 12px);
      max-width: 80%;
      padding: 10px 18px;
      background: var(--text);
      color: #000;
      border-radius: var(--radius);
      font-size: 13px;
      font-weight: 500;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
      z-index: 10;
    }
    #toast.show { opacity: 1; transform: translate(-50%, 0); }
  </style>
</head>
<body>
<div id="app">

  <header>
    <div class="wordmark">RC<span>&nbsp;//&nbsp;</span>Control</div>
    <div class="status">
      <div class="dot" id="status-dot"></div>
      <span id="status-text">Connecting</span>
    </div>
  </header>

  <main id="split"><!-- panels are built by script --></main>

</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
  // ── Config ───────────────────────────────────────────────────────────────
  const NUM_PLAYERS = 2;
  const PLAYER_RGB  = ['232, 255, 0', '0, 212, 255'];   // keep in sync with CSS
  const CARD_FRACTION = 0.64;   // card height as a share of the carousel height

  // ── State ────────────────────────────────────────────────────────────────
  let vehicles     = [];
  let players      = Array.from({ length: NUM_PLAYERS }, () => ({
    controller: { connected: false, name: null }, selected_vehicle: null,
  }));
  let prevSelected = Array(NUM_PLAYERS).fill(null);   // for animation / scroll triggers
  let ws           = null;
  let wsRetryDelay = 1000;
  let toastTimer   = null;

  // ── DOM ──────────────────────────────────────────────────────────────────
  const split      = document.getElementById('split');
  const statusDot  = document.getElementById('status-dot');
  const statusText = document.getElementById('status-text');
  const toastEl    = document.getElementById('toast');
  const panels     = [];   // { root, carousel, ctrl, ctrlText, ctrlDot, label, release }

  function buildPanels() {
    for (let p = 0; p < NUM_PLAYERS; p++) {
      if (p > 0) split.insertAdjacentHTML('beforeend', '<div class="divider"></div>');

      const root = document.createElement('section');
      root.className = 'panel';
      root.dataset.player = p;
      root.setAttribute('aria-label', `Player ${p + 1}`);
      root.innerHTML = `
        <div class="panel-head">
          <div class="player-name">Player ${p + 1}</div>
          <div class="ctrl"><div class="dot"></div><span>No controller</span></div>
        </div>
        <div class="carousel"><div class="state-message">Loading vehicles…</div></div>
        <div class="panel-foot">
          <div class="sel-label">No vehicle selected</div>
          <button class="release" type="button">Release</button>
        </div>`;
      split.appendChild(root);

      const panel = {
        root,
        carousel: root.querySelector('.carousel'),
        ctrl:     root.querySelector('.ctrl'),
        ctrlDot:  root.querySelector('.ctrl .dot'),
        ctrlText: root.querySelector('.ctrl span'),
        label:    root.querySelector('.sel-label'),
        release:  root.querySelector('.release'),
      };
      panel.release.addEventListener('click', () => release(p));
      new ResizeObserver(() => sizeCarousel(panel.carousel)).observe(panel.carousel);
      panels.push(panel);
    }
  }

  // Size cards relative to the carousel so the first/last card can centre and
  // the neighbours peek in.
  function sizeCarousel(el) {
    const h = el.clientHeight;
    if (!h) return;
    const cardH = Math.round(h * CARD_FRACTION);
    el.style.setProperty('--card-h', cardH + 'px');
    el.style.setProperty('--pad', Math.max(0, Math.round((h - cardH) / 2)) + 'px');
  }

  // ── Boot ─────────────────────────────────────────────────────────────────
  async function boot() {
    buildPanels();
    await loadVehicles();
    connectWS();
  }

  async function loadVehicles() {
    try {
      const res = await fetch('/api/vehicles');
      if (!res.ok) throw new Error(res.status);
      vehicles = await res.json();
      renderCarousels();
      updateUI();
    } catch {
      panels.forEach(p => {
        p.carousel.innerHTML = '<div class="state-message">Could not load vehicles. Check connection.</div>';
      });
    }
  }

  // ── Render ───────────────────────────────────────────────────────────────
  function renderCarousels() {
    panels.forEach((panel, p) => {
      if (!vehicles.length) {
        panel.carousel.innerHTML = '<div class="state-message">No vehicles configured.</div>';
        return;
      }

      panel.carousel.innerHTML = vehicles.map(v => `
        <div class="vehicle-card" data-id="${escHtml(v.id)}"
             role="button" tabindex="0" aria-label="${escHtml(v.name)}">
          <div class="card-image">
            ${v.image
              ? `<img src="/static/images/${escHtml(v.image)}" alt="" loading="lazy">`
              : '<span class="img-placeholder">🚗</span>'}
          </div>
          <div class="card-badge">
            <svg viewBox="0 0 12 12"><polyline points="1.5,6 4.5,9 10.5,3"/></svg>
            <span></span>
          </div>
          <div class="card-body">
            <div class="card-name">${escHtml(v.name)}</div>
            <div class="card-mac">${escHtml(v.mac)}</div>
          </div>
        </div>`).join('');

      panel.carousel.querySelectorAll('.vehicle-card').forEach(card => {
        const img = card.querySelector('img');
        if (img) img.addEventListener('error', () => {
          img.parentElement.innerHTML = '<span class="img-placeholder">🚗</span>';
        });
        card.addEventListener('click', () => select(p, card.dataset.id));
        card.addEventListener('keydown', e => {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); select(p, card.dataset.id); }
        });
      });
      sizeCarousel(panel.carousel);
    });
  }

  function ownerOf(vehicleId) {
    const idx = players.findIndex(pl => pl.selected_vehicle && pl.selected_vehicle.id === vehicleId);
    return idx === -1 ? null : idx;
  }

  function updateUI() {
    panels.forEach((panel, p) => {
      const pl  = players[p];
      const sel = pl.selected_vehicle ? pl.selected_vehicle.id : null;

      // Controller status
      const connected = !!(pl.controller && pl.controller.connected);
      panel.ctrl.classList.toggle('connected', connected);
      panel.ctrlDot.className = 'dot ' + (connected ? 'on' : 'off');
      panel.ctrlText.textContent = connected ? 'Controller connected' : 'No controller';

      // Cards
      panel.carousel.querySelectorAll('.vehicle-card').forEach(card => {
        const owner    = ownerOf(card.dataset.id);
        const mine     = owner === p;
        const taken    = owner !== null && !mine;
        const wasMine  = card.classList.contains('selected');

        card.classList.toggle('selected', mine);
        card.classList.toggle('taken', taken);
        card.setAttribute('aria-disabled', taken ? 'true' : 'false');
        card.tabIndex = taken ? -1 : 0;

        const badgeText = card.querySelector('.card-badge span');
        if (mine) {
          badgeText.textContent = 'Yours';
          card.style.removeProperty('--badge-rgb');
        } else if (taken) {
          badgeText.textContent = `Player ${owner + 1}`;
          card.style.setProperty('--badge-rgb', PLAYER_RGB[owner]);
        }

        // Replay the pulse only when this card has just become selected.
        if (mine && !wasMine) {
          card.classList.remove('pulse');
          void card.offsetWidth;
          card.classList.add('pulse');
        }
      });

      // Footer
      const vehicle = vehicles.find(v => v.id === sel);
      if (vehicle) {
        panel.label.innerHTML = `Driving&nbsp;&nbsp;<strong>${escHtml(vehicle.name)}</strong>`;
        panel.release.style.display = 'block';
      } else {
        panel.label.textContent = 'No vehicle selected';
        panel.release.style.display = 'none';
      }

      // Bring a newly selected card to the centre of this carousel.
      if (sel && sel !== prevSelected[p]) {
        const card = panel.carousel.querySelector(`.vehicle-card[data-id="${CSS.escape(sel)}"]`);
        if (card) card.scrollIntoView({ block: 'center', behavior: 'smooth' });
      }
      prevSelected[p] = sel;
    });
  }

  function applyState(msg) {
    if (!msg || !Array.isArray(msg.players)) return;
    players = msg.players;
    updateUI();
  }

  // ── Actions ──────────────────────────────────────────────────────────────
  async function select(player, id) {
    const owner = ownerOf(id);
    if (owner === player) return;                       // already mine
    if (owner !== null) {                               // other player's
      toast(`${vehicleName(id)} is in use by Player ${owner + 1}`);
      return;
    }

    try {
      const res  = await fetch(`/api/players/${player}/select/${encodeURIComponent(id)}`, { method: 'POST' });
      const body = await res.json().catch(() => null);
      if (res.ok) {
        applyState(body);
      } else if (res.status === 409 && body) {
        // Lost a race: the other player claimed it a moment earlier.
        applyState(body.state);
        toast(body.error);
      } else {
        toast('Could not select vehicle');
      }
    } catch {
      toast('Could not reach the controller');
    }
  }

  async function release(player) {
    try {
      const res = await fetch(`/api/players/${player}/deselect`, { method: 'POST' });
      if (res.ok) applyState(await res.json());
    } catch {
      toast('Could not reach the controller');
    }
  }

  // ── WebSocket ────────────────────────────────────────────────────────────
  function connectWS() {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(`${proto}://${location.host}/ws`);

    ws.onopen = () => {
      setStatus('on', 'Live');
      wsRetryDelay = 1000;
    };

    ws.onmessage = ({ data }) => {
      try {
        const msg = JSON.parse(data);
        if (msg.event === 'state_update') applyState(msg);
      } catch { /* ignore malformed */ }
    };

    ws.onclose = () => {
      setStatus('off', 'Offline');
      setTimeout(connectWS, wsRetryDelay);
      wsRetryDelay = Math.min(wsRetryDelay * 2, 10000);   // capped at 10 s
    };

    ws.onerror = () => ws.close();
  }

  // ── UI helpers ───────────────────────────────────────────────────────────
  function setStatus(state, label) {
    statusDot.className = `dot ${state}`;
    statusText.textContent = label;
  }

  function vehicleName(id) {
    const v = vehicles.find(v => v.id === id);
    return v ? v.name : 'Vehicle';
  }

  function toast(text) {
    toastEl.textContent = text;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2400);
  }

  function escHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  boot();
</script>
</body>
</html>
