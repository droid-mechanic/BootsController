# /etc/systemd/system/getty@tty1.service.d/autologin.conf
#
# Phase 9 — Auto-login the 'pi' user on tty1 without a password prompt.
#
# This drop-in overrides only the ExecStart of the getty unit, leaving
# everything else (timeouts, security settings) intact.
#
# Install:
#   sudo mkdir -p /etc/systemd/system/getty@tty1.service.d/
#   sudo cp autologin.conf /etc/systemd/system/getty@tty1.service.d/
#   sudo systemctl daemon-reload

[Service]
ExecStart=
ExecStart=-/sbin/agetty --autologin pi --noclear %I $TERM
